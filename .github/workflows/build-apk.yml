name: Build APK

on:
  push:
    branches: [ "claude/*", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Debug - Show commit and manifest
      run: |
        echo "=== Current commit ==="
        git log --oneline -1
        echo ""
        echo "=== Full AndroidManifest.xml ==="
        cat app/src/main/AndroidManifest.xml
        echo ""
        echo "=== All resource files ==="
        find app/src/main/res -type f | sort

    - name: Clean and Build Debug APK
      run: |
        set +e
        ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace --console=plain > build-output.log 2>&1
        BUILD_EXIT=$?
        cat build-output.log
        if [ $BUILD_EXIT -ne 0 ]; then
          echo ""
          echo "============================================"
          echo "=== EXTRACTED ERRORS ==="
          echo "============================================"
          echo ""
          echo "--- Lines with 'error' ---"
          grep -i "error" build-output.log | grep -v "^	at " | head -30 || true
          echo ""
          echo "--- Kotlin compiler errors (e:) ---"
          grep "^e: " build-output.log | head -30 || true
          echo ""
          echo "--- What went wrong ---"
          sed -n '/What went wrong/,/Try:/p' build-output.log || true
          exit 1
        fi

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build-output.log
        retention-days: 7

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: os-emu-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Build Release APK (unsigned)
      if: success()
      run: ./gradlew assembleRelease --no-daemon --no-build-cache --stacktrace --console=plain

    - name: Upload Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: os-emu-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
