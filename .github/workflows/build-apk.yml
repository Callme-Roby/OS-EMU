name: Build APK

on:
  push:
    branches: [ "claude/*", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Debug - Show commit and manifest
      run: |
        echo "=== Current commit ==="
        git log --oneline -1
        echo ""
        echo "=== Full AndroidManifest.xml ==="
        cat app/src/main/AndroidManifest.xml
        echo ""
        echo "=== All resource files ==="
        find app/src/main/res -type f | sort
        echo ""
        echo "=== Searching for ANY mipmap reference in entire project ==="
        grep -rn "mipmap" app/ || echo "CONFIRMED: Zero mipmap references found"
        echo ""
        echo "=== Searching for ic_launcher references ==="
        grep -rn "ic_launcher" app/ || echo "No ic_launcher references"

    - name: Clean and Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: os-emu-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease --no-daemon --no-build-cache --stacktrace
      continue-on-error: true

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: os-emu-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
